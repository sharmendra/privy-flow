[alembic]
script_location = %(here)s/migrations
# The database URL is never stored here. Set PRIVYFLOW_SAN_MIGRATION_DATABASE_URL to an
# admin role URL. Run from the repository root:
#   uv run alembic -c services/sanitization_service/alembic.ini upgrade head
# Role that receives least-privilege access to the vault table (see scripts/create_db_roles.py).
runtime_role = privyflow_runtime
