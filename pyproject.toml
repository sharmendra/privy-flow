[project]
name = "privyflow"
version = "0.0.0"
description = "PrivyFlow privacy engine: Sanitization and De-sanitization services"
requires-python = ">=3.11"
# Runtime dependencies are added with each service, with a documented reason.
dependencies = []

[tool.uv]
package = false
default-groups = ["dev"]

[dependency-groups]
# Core test tooling. Installed by default with `uv sync`.
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "pyright>=1.1.380",
]
# PostgreSQL integration tests (needs Docker). `uv sync --group integration`
integration = ["testcontainers[postgres]>=4.8"]
# Load tests. `uv sync --group perf`
perf = ["locust>=2.29"]
# Static security analysis and dependency scanning. `uv sync --group security`
security = ["bandit>=1.7", "pip-audit>=2.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
    "unit: fast, isolated tests with no network or database",
    "integration: API and database tests for a single service",
    "security: authorization, isolation, cryptography and leakage tests",
    "evaluation: detection quality evaluation against the synthetic dataset",
    "e2e: cross-service tests against separately running services",
]

[tool.coverage.run]
source = ["services"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["tests", "scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
